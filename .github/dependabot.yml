version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Node's types follow the runtime's major (.nvmrc); a new Node major is a deliberate change.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # The image's Node follows the runtime's major (.nvmrc); a new Node major is a deliberate change.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
