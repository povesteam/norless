version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Node's types follow the runtime's major (.nvmrc); a new Node major is a deliberate change.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 waits for typescript-eslint, whose peer range stops below it (<6.1.0 in 8.71).
      - dependency-name: typescript
        versions: [">=7"]
      # 6.5.0's package.json points at dist/index.js and index.d.ts, which it doesn't ship.
      - dependency-name: tonal
        versions: ["6.5.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # The image's Node follows the runtime's major (.nvmrc); a new Node major is a deliberate change.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
