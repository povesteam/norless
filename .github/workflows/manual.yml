name: Manual

# The manual on GitHub Pages, with fresh pictures from npm run screenshots, which git
# doesn't keep (PLAN.md, Manual). Pages must use "GitHub Actions" as its source.

on:
  push:
    branches: [main]
    paths:
      [
        manual/**,
        e2e/screenshots/**,
        src/client/**,
        .github/workflows/manual.yml,
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run screenshots

      # In the repository the pictures sit beside the manual; on the site, inside it.
      - name: Pictures into the manual
        run: |
          cp screenshots/*.png manual/
          sed -i 's#](\.\./screenshots/#](#g' manual/*.md

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: manual
          destination: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
